name: PR Checks
on: [pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install check dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit black==24.10.0 isort==5.13.2
      - run: pre-commit run --all-files
      - run: python 3_bootstrap_scripts/schema_enforcement.py
      - run: python 3_bootstrap_scripts/architecture_check.py
      - run: python 3_bootstrap_scripts/traceability_graph.py
      - run: mkdir -p ai_reports
      - run: python 3_bootstrap_scripts/ai_review.py > ai_reports/last_review.yaml
      - run: bash 3_bootstrap_scripts/performance_scan.sh
      - run: bash 3_bootstrap_scripts/runtime_security_check.sh
      - uses: actions/upload-artifact@v4
        with: { name: ai-reports, path: ai_reports }
